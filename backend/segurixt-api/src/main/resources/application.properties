spring.application.name=segurixt-api

# Servidor
server.port=${PORT:8080}

# Conexion MySQL
spring.datasource.url=${DB_JDBC_URL:jdbc:mysql://localhost:3306/segurixt_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Registro
logging.level.org.hibernate.SQL=INFO

# Sin valor predeterminado: generar fuera del repositorio.
auth.jwt.secret=${AUTH_JWT_SECRET}
auth.jwt.issuer=${AUTH_JWT_ISSUER:segurixt-api}

# La única autenticación es la implementada con usuarios y Bearer JWT.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Orígenes exactos; el perfil prod exige configurarlos explícitamente.
auth.cors.origins=${AUTH_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
products.images.directory=${PRODUCTS_IMAGES_DIRECTORY:./uploads/productos}
